# Falcon API Boilerplate – Render Blueprint (IaC)
# Defines PostgreSQL, Redis (Key Value), and the Python Web Service.

databases:
  - name: api-saas-db
    databaseName: api_saas_db
    plan: free

services:
  - type: keyvalue
    name: api-saas-redis
    ipAllowList: []
    plan: frees

  - type: web
    name: api-saas-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:api
    envVars:
      - key: PYTHONPATH
        value: src
      - key: DATABASE_URL
        fromDatabase:
          name: api-saas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: api-saas-redis
          property: connectionString
      - key: AUTH_BEARER_TOKEN
        sync: false
    healthCheckPath: /health
